version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: "/src/main/docker"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
