name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Verify the tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -E '^version' gradle.properties | cut -d= -f2 | tr -d ' ')"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $PROJECT_VERSION in gradle.properties." >&2
            exit 1
          fi
          echo "Releasing version $PROJECT_VERSION."

      - name: Build Jenkins LTS docker image
        run: docker build -t jenkins-rest/jenkins src/main/docker

      - name: Run Jenkins LTS docker image
        run: docker run -d --rm -p 8080:8080 --name jenkins-rest jenkins-rest/jenkins

      - name: Wait for Jenkins to become available
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/login; then
              echo "Jenkins is up after ${i}s."
              exit 0
            fi
            sleep 5
          done
          echo "Jenkins did not become available in time." >&2
          docker logs jenkins-rest >&2
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the full test suite
        run: ./gradlew clean build mockTest integTest --stacktrace

      - name: Stop docker
        if: always()
        run: docker stop jenkins-rest

      - name: Build the signed deployment bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew bundleForCentral

      - name: Upload the bundle to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          BUNDLE="build/distributions/jenkins-rest-${GITHUB_REF_NAME#v}-bundle.zip"
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          HTTP_CODE=$(curl -sS -o /tmp/upload.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $AUTH" \
            -F "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${GITHUB_REF_NAME}&publishingType=USER_MANAGED")
          echo "HTTP $HTTP_CODE"
          cat /tmp/upload.out
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Upload failed." >&2
            exit 1
          fi
          echo "Deployment uploaded. Review and release it at https://central.sonatype.com/publishing/deployments"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See RELEASE_NOTES.md for the full changelog."
