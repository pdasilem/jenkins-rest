name: Jenkins REST CI Build
run-name: ${{ github.actor }} is running Jenkins REST CI Build on GitHub Actions 🚀
on: [push, pull_request]
jobs:
  build:
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 21, 25 ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Build Jenkins LTS docker image
        run: docker build -t jenkins-rest/jenkins src/main/docker

      - name: Run Jenkins LTS docker image
        run: docker run -d --rm -p 8080:8080 --name jenkins-rest jenkins-rest/jenkins

      - name: Wait for Jenkins to become available
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/login; then
              echo "Jenkins is up after ${i}s."
              exit 0
            fi
            sleep 5
          done
          echo "Jenkins did not become available in time." >&2
          docker logs jenkins-rest >&2
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        run: ./gradlew clean build mockTest integTest --stacktrace

      - name: Stop docker
        if: always()
        run: docker stop jenkins-rest
